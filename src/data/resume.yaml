# Single source of truth for BOTH the web resume (/resume/) and the generated
# PDF (/vince-caldwell-resume.pdf). Edit here only — never edit a PDF by hand.
#
# The `file()` loader needs a top-level keyed object, so everything hangs off
# one `main` entry. Validated by the `resume` collection in src/content.config.ts,
# so a typo fails the build rather than silently rendering an empty section.

