name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the build job only — same verification, no deploy.
  pull_request:
  # Lets the first run be retried after enabling Pages, with no empty commit.
  workflow_dispatch:

# Deploy credentials are granted per-job, not here: a pull request build has no
# business holding pages: write.
permissions:
  contents: read

concurrency:
  # Per-ref, so pull request builds do not queue behind one another. main is a
  # single ref, so deploys still serialise.
  group: pages-${{ github.ref }}
  # Never cancel a deploy mid-publish. Superseded PR builds are safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build site
        run: npx astro build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Server lifetime is kept inside a single step. Backgrounding a server in
      # one step and using it from the next relies on the orphaned process
      # surviving the step boundary, which is unspecified and fails
      # intermittently.
      #
      # `astro preview --background` is Astro 7's managed daemon: it returns
      # only once the server is accepting connections, so no readiness polling
      # is needed, and `astro preview stop` shuts it down deterministically.
      - name: Generate resume PDF and audit accessibility
        run: |
          set -euo pipefail

          npx astro preview --background --port 4321
          trap 'npx astro preview stop || true' EXIT

          # Writes into dist/ AFTER the build, since astro build wipes it, and
          # before the artifact is uploaded below.
          node scripts/make-resume-pdf.mjs

          # Fails the build on a contrast, heading-order or alt-text
          # regression, in both themes.
          node scripts/audit-a11y.mjs
        env:
          PDF_BASE_URL: http://localhost:4321
          PREVIEW_URL: http://localhost:4321

      # Uploaded on pull requests too. It costs little, and it means a PR
      # exercises the identical path a deploy takes rather than a near-copy.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Verification runs everywhere; publishing only from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
